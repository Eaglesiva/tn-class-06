<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"/>
  <title>தமிழ்நாடு பாடநூல் அசல் அச்சுப் பார்வை</title>
  <script src="./vendor/pdfjs/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1329;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Minimalist Floating Controls Toolbar */
    .viewer-toolbar {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 12px;
      user-select: none;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .tool-btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .zoom-text {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      min-width: 46px;
      text-align: center;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308; /* Yellow = loading, Green = cached/HD */
      transition: background 0.3s ease;
    }
    .status-dot.cached {
      background: #10b981;
    }

    /* Page Viewport */
    .viewport-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 8px 30px 8px;
      overflow-x: auto;
    }
    .canvas-wrapper {
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      background: #ffffff;
      line-height: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    
    /* Loading Skeleton */
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      transition: opacity 0.3s ease;
      gap: 12px;
      z-index: 10;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Floating Viewer Toolbar -->
  <div class="viewer-toolbar">
    <button class="tool-btn" onclick="zoomChange(-0.25)" title="ஜூம் குறை (-)">&minus;</button>
    <span class="zoom-text" id="zoomLabel">100%</span>
    <button class="tool-btn" onclick="zoomChange(0.25)" title="ஜூம் அதிகரி (+)">&plus;</button>
    <button class="tool-btn" onclick="fitToWidth()" title="திரைக்கு ஏற்ப பொருத்து">⤢ திரையளவு</button>
    <button class="tool-btn" onclick="resetZoom()" title="இயல்பு நிலை">↺ 100%</button>
    <span class="status-dot" id="cacheStatusDot" title="ஆஃப்லைன் சேமிப்பு நிலை"></span>
  </div>

  <!-- Main Viewport -->
  <div class="viewport-container" id="viewportContainer">
    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">அதிவேக வெக்டார் பக்கம் தயாராகிறது...</div>
      </div>
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.js';

    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('pdf') || './tamil/term1/iel_1/01_inbatamil/page_02.pdf';

    let pdfDoc = null;
    let pageNum = 1;
    let currentScale = 1.0;
    let baseViewport = null;
    let isRendering = false;
    let renderPending = false;

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const zoomLabel = document.getElementById('zoomLabel');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const cacheStatusDot = document.getElementById('cacheStatusDot');
    const canvasWrapper = document.getElementById('canvasWrapper');

    // ----------------------------------------------------
    // IndexedDB Cache Layer (100% Offline, Zero Redundant Downloads)
    // ----------------------------------------------------
    const DB_NAME = 'TNSchoolsPdfCache';
    const DB_VERSION = 1;
    const STORE_NAME = 'pdf_blobs';

    function openCacheDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getCachedPdf(key) {
      try {
        const db = await openCacheDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function setCachedPdf(key, arrayBuffer) {
      try {
        const db = await openCacheDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(arrayBuffer, key);
      } catch (e) {
        console.warn('Cache write failed:', e);
      }
    }

    // ----------------------------------------------------
    // Progressive PDF Loading Pipeline
    // ----------------------------------------------------
    async function loadPdfDocument() {
      const startTime = performance.now();
      
      // 1. Try local device IndexedDB Cache first
      const cached = await getCachedPdf(pdfUrl);
      let pdfData;

      if (cached) {
        pdfData = cached;
        cacheStatusDot.classList.add('cached');
        cacheStatusDot.title = 'மின்வேக ஆஃப்லைன் போன் மெமரி (IndexedDB)';
      } else {
        // Fetch from Cloudflare CDN
        const response = await fetch(pdfUrl);
        pdfData = await response.arrayBuffer();
        // Save to IndexedDB for all future visits
        await setCachedPdf(pdfUrl, pdfData);
        cacheStatusDot.classList.add('cached');
        cacheStatusDot.title = 'Cloudflare CDN-லிருந்து டவுன்லோட் ஆகி சேமிக்கப்பட்டது';
      }

      // Load with PDF.js
      const loadingTask = pdfjsLib.getDocument({ data: pdfData });
      pdfDoc = await loadingTask.promise;
      const page = await pdfDoc.getPage(1);
      baseViewport = page.getViewport({ scale: 1.0 });

      // Automatically calculate initial scale to fit mobile screen nicely
      calculateInitialScale();

      // Render Stage 1 & 2
      await renderPage(currentScale);
      loadingOverlay.classList.add('hidden');
    }

    function calculateInitialScale() {
      const containerWidth = Math.min(window.innerWidth - 32, 900);
      currentScale = Math.min(2.0, Math.max(0.8, containerWidth / baseViewport.width));
    }

    // ----------------------------------------------------
    // HD Retina Canvas Rendering
    // ----------------------------------------------------
    async function renderPage(scale) {
      if (isRendering) {
        renderPending = true;
        return;
      }
      isRendering = true;

      const page = await pdfDoc.getPage(1);
      
      // Use devicePixelRatio for razor-sharp Retina displays
      const dpr = window.devicePixelRatio || 1;
      const viewport = page.getViewport({ scale: scale });

      // Canvas internal resolution (Sharp Vector Pixels)
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);

      // Display CSS dimensions
      canvas.style.width = Math.floor(viewport.width) + 'px';
      canvas.style.height = Math.floor(viewport.height) + 'px';
      canvasWrapper.style.width = Math.floor(viewport.width) + 'px';

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport,
        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
      };

      await page.render(renderContext).promise;
      isRendering = false;

      zoomLabel.textContent = Math.round(scale * 100) + '%';

      if (renderPending) {
        renderPending = false;
        renderPage(currentScale);
      }
    }

    // ----------------------------------------------------
    // Zoom Controls
    // ----------------------------------------------------
    function zoomChange(delta) {
      const newScale = Math.max(0.5, Math.min(4.0, currentScale + delta));
      if (Math.abs(newScale - currentScale) > 0.05) {
        currentScale = newScale;
        renderPage(currentScale);
      }
    }

    function fitToWidth() {
      calculateInitialScale();
      renderPage(currentScale);
    }

    function resetZoom() {
      currentScale = 1.0;
      renderPage(currentScale);
    }

    window.addEventListener('resize', () => {
      // Gentle resize debounce
      clearTimeout(window._rsTimer);
      window._rsTimer = setTimeout(() => {
        if (currentScale <= 1.2) {
          fitToWidth();
        }
      }, 200);
    });

    // Start
    loadPdfDocument().catch(err => {
      console.error(err);
      loadingOverlay.innerHTML = '<div style="color:#ef4444;font-weight:700;">பக்கம் ஏற்றுவதில் பிழை ஏற்பட்டது.</div>';
    });
  </script>
</body>
</html>
